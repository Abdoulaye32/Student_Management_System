<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Course - Student Portal</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2>Student Portal</h2>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="students.html">
                Students
            </a>

            <a href="academic-records.html">
                Academic Records
            </a>

            <a href="courses.html" class="active">
                Courses
            </a>

            <a href="settings.html">
                Settings
            </a>

        </nav>

        <a href="logout.html" class="logout">
            Logout
        </a>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">


        <!-- TOP BAR -->

        <header class="topbar">

            <div>

                <h1>Add Course</h1>

                <p>
                    Add a new course to the system
                </p>

            </div>


            <div class="profile">

                <div class="profile-circle">
                    A
                </div>

                <span>
                    Administrator
                </span>

            </div>

        </header>


        <!-- COURSE FORM -->

        <section class="content-card">

            <h2>Course Information</h2>


            <form class="student-form">


                <!-- COURSE CODE / NAME -->

                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Course Code
                        </label>

                        <input
                            type="text"
                            placeholder="e.g. CSC301"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Course Name
                        </label>

                        <input
                            type="text"
                            placeholder="Enter course name"
                        >

                    </div>

                </div>


                <!-- DEPARTMENT / LEVEL -->

                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Department
                        </label>

                        <select>

                            <option>
                                Select department
                            </option>

                            <option>
                                Computer Science
                            </option>

                            <option>
                                Information Technology
                            </option>

                            <option>
                                Software Engineering
                            </option>

                            <option>
                                Business Administration
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Level
                        </label>

                        <select>

                            <option>
                                Select level
                            </option>

                            <option>
                                Level 100
                            </option>

                            <option>
                                Level 200
                            </option>

                            <option>
                                Level 300
                            </option>

                            <option>
                                Level 400
                            </option>

                        </select>

                    </div>

                </div>


                <!-- CREDIT HOURS / SEMESTER -->

                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Credit Hours
                        </label>

                        <input
                            type="number"
                            placeholder="e.g. 3"
                            min="1"
                            max="10"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Semester
                        </label>

                        <select>

                            <option>
                                Select semester
                            </option>

                            <option>
                                Semester 1
                            </option>

                            <option>
                                Semester 2
                            </option>

                        </select>

                    </div>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group full-width">

                    <label>
                        Course Description
                    </label>

                    <textarea
                        rows="5"
                        placeholder="Enter a short description of the course">
                    </textarea>

                </div>


                <!-- BUTTONS -->

                <div class="form-buttons">

                    <a
                        href="courses.html"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Course
                    </button>

                </div>


            </form>

        </section>

    </main>

</body>

</html>
