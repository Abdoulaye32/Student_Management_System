{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Student Portal</title>

    <link rel="stylesheet" href="{% static 'portal/style.css' %}">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>Student Portal</h2>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="students.html" class="active">Students</a>
            <a href="academic-records.html">Academic Records</a>
            <a href="courses.html">Courses</a>
            <a href="settings.html">Settings</a>
        </nav>

        <a href="logout.html" class="logout">Logout</a>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOP BAR -->
        <header class="topbar">

            <div>
                <h1>Add Student</h1>
                <p>Register a new student</p>
            </div>

            <div class="profile">
                <div class="profile-circle">A</div>
                <span>Administrator</span>
            </div>

        </header>


        <!-- ADD STUDENT FORM -->
        <section class="content-card">

            <h2>Student Information</h2>

            <form class="student-form">

                <div class="form-row">

                    <div class="form-group">
                        <label>Student ID</label>
                        <input type="text" placeholder="e.g. STU004">
                    </div>

                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="Enter first name">
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Enter last name">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter email address">
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" placeholder="Enter phone number">
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date">
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label>Gender</label>

                        <select>
                            <option>Select gender</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>

                    </div>


                    <div class="form-group">
                        <label>Department</label>

                        <select>
                            <option>Select department</option>
                            <option>Computer Science</option>
                            <option>Information Technology</option>
                            <option>Software Engineering</option>
                            <option>Business Administration</option>
                        </select>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label>Level</label>

                        <select>
                            <option>Select level</option>
                            <option>Level 100</option>
                            <option>Level 200</option>
                            <option>Level 300</option>
                            <option>Level 400</option>
                        </select>

                    </div>


                    <div class="form-group">
                        <label>Registration Date</label>
                        <input type="date">

                    </div>

                </div>


                <div class="form-group full-width">

                    <label>Address</label>

                    <textarea
                        rows="4"
                        placeholder="Enter student's address">
                    </textarea>

                </div>


                <!-- BUTTONS -->
                <div class="form-buttons">

                    <a href="students.html" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="save-btn">
                        Save Student
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
